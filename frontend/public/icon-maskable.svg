<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Меч в земле и мак">
  <rect width="64" height="64" fill="#131318"/>
  <g transform="translate(8.320 8.320) scale(0.74)">
<g fill="#d8d6de">
    <!-- навершие: плоский шестиугольник -->
    <path d="M29 5h6l2 2.2-2 2.2h-6l-2-2.2Z"/>
    <!-- рукоять -->
    <path d="M30.8 9.4h2.4v7.2h-2.4Z"/>
    <!-- гарда: чистая перекладина с утолщёнными концами -->
    <path d="M18.4 17h27.2v3.4H18.4Z"/>
    <path d="M17 16.2h1.8v5H17Zm28.2 0H47v5h-1.8Z"/>
    <!-- клинок -->
    <path d="M29.2 20.4h5.6l-.9 23.6-.7 8.4L32 59l-1.2-6.6-.7-8.4Z"/>
  </g>

  <!-- дол -->
  <path d="M32 22v20" stroke="#131318" stroke-width=".8"/>

  <!-- линия земли, разорванная клинком -->
  <g fill="#d8d6de">
    <path d="M3.2 43.2 28.9 42.6v3.2L3.2 45Z"/>
    <path d="M35.1 42.6 60.8 43.2v1.8L35.1 45.8Z"/>
  </g>

  <!-- корни: держатся ближе к клинку — на 16px сливаются в хвост, а не в шум -->
  <g stroke="#d8d6de" fill="none" stroke-width="1.7" stroke-linecap="round">
    <path d="M30.2 46.6c-2 2-3.4 4-4.6 6.8"/>
    <path d="M33.8 46.4c1.8 1.8 3.2 3.6 4.4 6.2"/>
    <path d="M30.8 50.6c-.8 2.4-1.2 4.4-1.2 7"/>
  </g>
  <!-- мак: стебель поднимается и перегибается крюком вниз-вправо -->
  <path d="M38.6 43c.4-6 1-10.4 3-13.2 1.6-2.2 3.8-3 5.4-2.2 1.2.6 1.6 1.8 1.2 2.8"
        stroke="#d8d6de" fill="none" stroke-width="1.9" stroke-linecap="round"/>
  <!-- лист -->
  <path d="M39.2 37.6c2-1.8 3.8-2 5.4-.6-2 1.8-3.8 2-5.4.6Z" fill="#d8d6de"/>
  <!-- коробочка свисает с крюка; низ вырезан — это раскрытые лепестки -->
  <path d="M48.6 28.4 52.8 30l1.6 3.2-.9 3.5-2.7 2.3c-1.6-1.6-3.7-1.6-5.5-.2l-2.3-2.1-.7-3.4 1.2-3.2Z"
        fill="#d8d6de"/>
  <!-- семенная коронка в раскрыве -->
  <path d="M46.8 35.8h3" stroke="#131318" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>
