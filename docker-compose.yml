services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timescheduler
      POSTGRES_USER: ts_user
      POSTGRES_PASSWORD: ts_secure_pass_2026
    ports:
      - "5433:5432"   # host-side access for local Node dev; inside the compose network db:5432 still works.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ts_user -d timescheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile.node
      network: host
    env_file: .env
    environment:
      # Override .env's host=localhost (which is meant for bare-metal Node dev).
      # Inside the compose network the Postgres service is reachable as `db`.
      # Both vars must point at `db` — Prisma uses DATABASE_URL_PRISMA, while
      # the S3 backup pipeline (pg_dump) reads DATABASE_URL.
      DATABASE_URL: postgresql://ts_user:ts_secure_pass_2026@db:5432/timescheduler
      DATABASE_URL_PRISMA: postgresql://ts_user:ts_secure_pass_2026@db:5432/timescheduler
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups

  frontend:
    build:
      context: ./frontend
      network: host
    ports:
      - "3000:80"
    depends_on:
      - backend-node

volumes:
  pgdata:
    name: timescheduler_pgdata
    external: true

# Docker's automatic pool allocator refuses every predefined pool while a
# split-tunnel VPN is up (its 128.0.0.0/1 / 64.0.0.0/2 / ... routes cover the
# whole 172.16/12 and 192.168/16 space), failing with "all predefined address
# pools have been fully subnetted". An explicit subnet bypasses the allocator.
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/16
