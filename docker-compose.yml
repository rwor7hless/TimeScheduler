services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timescheduler
      POSTGRES_USER: ts_user
      POSTGRES_PASSWORD: ts_secure_pass_2026
    ports:
      - "5433:5432"   # host-side access for local Node dev; inside the compose network db:5432 still works.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ts_user -d timescheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile.node
      network: host
    env_file: .env
    environment:
      DATABASE_URL_PRISMA: postgresql://ts_user:ts_secure_pass_2026@db:5432/timescheduler
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups

  frontend:
    build:
      context: ./frontend
      network: host
    ports:
      - "3000:80"
    depends_on:
      - backend-node

volumes:
  pgdata:
    name: timescheduler_pgdata
    external: true
